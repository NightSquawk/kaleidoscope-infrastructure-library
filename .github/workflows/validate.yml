name: Validate library
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python tooling/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python tooling/preview.py
      - run: python tooling/release.py
      - uses: actions/upload-artifact@v7
        with:
          name: infrastructure-library-preview-and-source
          path: |
            dist/preview.html
            dist/kaleidoscope-infrastructure-library.zip
          if-no-files-found: error
          retention-days: 30
